- main:
  - paragraph: Pausat i steg 2
  - heading "Vem är vem?" [level=1]
  - paragraph: /Lyssna och sätt namn på talarna\. Namnen skrivs in i transkriptet när du fortsätter\. Granska senast 8 okt \d+:\d+\. Därefter avbryts körningen\./
  - group:
    - list:
      - listitem: Talare 1 Anna Berg
      - listitem: Talare 2 Erik Lund
      - listitem: Talare 3 Inget namn
    - button "Namnge talarna"
    - button "Avvisa"
    - button "Godkänn och fortsätt"
  - heading "Transkript" [level=2]
  - region "Inspelning och transkript":
    - radiogroup "Visa talare":
      - radio "Alla" [checked]
      - radio "Anna Berg"
      - radio "Erik Lund"
      - radio "Talare 3"
    - group:
      - group
      - searchbox "Sök i transkriptet"
    - status
    - button "Hämta granskat transkript"
    - link "Hoppa förbi transkriptet":
      - /url: /#.+/
    - heading "Del 1" [level=3]
    - list "Del 1":
      - listitem /Anna Berg, 0:\d+ i del 1/:
        - button "Anna Berg, ändra talare"
        - button /Spela från 0:\d+ i del 1/
        - text: Välkomna till kommunstyrelsens möte.
        - button /Rätta repliken från 0:\d+/
      - listitem /Erik Lund, 0:\d+ i del 1/:
        - button "Erik Lund, ändra talare"
        - button /Spela från 0:\d+ i del 1/
        - text: Första punkten gäller budgeten för nästa år.
        - button /Rätta repliken från 0:\d+/
      - listitem /Talare 3, 0:\d+ i del 1/:
        - button "Talare 3, ändra talare"
        - button /Spela från 0:\d+ i del 1/
        - text: Ramen höjs med två procent
        - button /Rätta repliken från 0:\d+/
      - listitem /Anna Berg, 0:\d+ i del 1/:
        - button "Anna Berg, ändra talare"
        - button /Spela från 0:\d+ i del 1/
        - text: och förvaltningen återkommer i oktober.
        - button /Rätta repliken från 0:\d+/
    - heading "Del 2" [level=3]
    - list "Del 2":
      - listitem /Erik Lund, 0:\d+ i del 2/:
        - button "Erik Lund, ändra talare"
        - button /Spela från 0:\d+ i del 2/
        - text: Andra punkten är skolskjutsarna.
        - button /Rätta repliken från 0:\d+/
      - listitem /Anna Berg, 0:\d+ i del 2/:
        - button "Anna Berg, ändra talare"
        - button /Spela från 0:\d+ i del 2/
        - text: Nya turer börjar gälla efter höstlovet.
        - button /Rätta repliken från 0:\d+/
    - 'group "Uppspelning: Inspelningen"':
      - button "Spela upp"
      - slider "Position i inspelningen"
      - text: /0:\d+ \/ 0:\d+/
      - button "Hastighet 1×"