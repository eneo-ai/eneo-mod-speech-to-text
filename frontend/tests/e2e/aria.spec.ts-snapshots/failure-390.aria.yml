- main:
  - 'button "Uppgifter, Deltagare: Anna Berg, Erik Lund"'
  - status
  - heading "Dokumentet kunde inte skapas" [level=1]
  - paragraph: /Startad i dag \d+:\d+/
  - note: Steg 2, Skriv rapporten Körningen kunde inte slutföras. Det går bra att köra flödet igen om en stund.
  - button "Försök igen"
  - paragraph: Försök igen fortsätter där körningen stannade. Det som redan blev klart görs inte om.
  - region "Stegen":
    - heading "Stegen" [level=2]
    - list:
      - listitem: Transkribera Klar
      - listitem: Skriv rapporten Misslyckades
  - region "Transkript":
    - heading "Transkript" [level=2]
    - button "Kopiera transkriptet"
    - status
    - button "Ladda ner .txt , transkriptet"
    - region "Inspelning och transkript":
      - radiogroup "Visa talare":
        - radio "Alla" [checked]
        - radio "Talare 1"
        - radio "Talare 2"
      - group:
        - group
        - searchbox "Sök i transkriptet"
      - status
      - link "Hoppa förbi transkriptet":
        - /url: /#.+/
      - heading "Del 1" [level=3]
      - list "Del 1":
        - listitem /Talare 1, 0:\d+ i del 1/:
          - button "Talare 1, ändra talare"
          - button /Spela från 0:\d+ i del 1/
          - text: Välkomna till kommunstyrelsens möte.
          - button /Rätta repliken från 0:\d+/
        - listitem /Talare 2, 0:\d+ i del 1/:
          - button "Talare 2, ändra talare"
          - button /Spela från 0:\d+ i del 1/
          - text: Första punkten gäller budgeten för nästa år.
          - button /Rätta repliken från 0:\d+/
        - listitem /Talare 1, 0:\d+ i del 1/:
          - button "Talare 1, ändra talare"
          - button /Spela från 0:\d+ i del 1/
          - text: Ramen höjs med två procent och förvaltningen återkommer i oktober.
          - button /Rätta repliken från 0:\d+/
      - heading "Del 2" [level=3]
      - list "Del 2":
        - listitem /Talare 2, 0:\d+ i del 2/:
          - button "Talare 2, ändra talare"
          - button /Spela från 0:\d+ i del 2/
          - text: Andra punkten är skolskjutsarna.
          - button /Rätta repliken från 0:\d+/
        - listitem /Talare 1, 0:\d+ i del 2/:
          - button "Talare 1, ändra talare"
          - button /Spela från 0:\d+ i del 2/
          - text: Nya turer börjar gälla efter höstlovet.
          - button /Rätta repliken från 0:\d+/
      - 'group "Uppspelning: Inspelningen"':
        - button "Spela upp"
        - slider "Position i inspelningen"
        - text: /0:\d+ \/ 0:\d+/
        - button "Hastighet 1×"
  - region "Kontakta support":
    - heading "Kontakta support" [level=2]
    - text: Körnings-ID
    - code: run-failed
    - button "Kopiera körnings-ID"
    - status
    - button "Dölj teknisk information" [expanded]
    - paragraph: "/Step 2 failed: the model provider returned \\d+ Service Unavailable\\./"
    - paragraph: flow_step_failed