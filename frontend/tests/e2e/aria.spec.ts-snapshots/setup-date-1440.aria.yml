- main:
  - heading "Nämndmöte med mötesdatum" [level=1]
  - paragraph: Frågar efter dagen mötet hölls.
  - text: Mötesdatum Valfritt
  - button "Stäng kalender"
  - combobox "Mötesdatum Valfritt" [expanded]
  - alert
  - dialog "Välj datum":
    - button "Föregående månad":
      - status
    - text: /september \d+/
    - button "Nästa månad":
      - status
    - grid /september \d+/:
      - row "må ti on to fr lö sö":
        - columnheader "må"
        - columnheader "ti"
        - columnheader "on"
        - columnheader "to"
        - columnheader "fr"
        - columnheader "lö"
        - columnheader "sö"
      - row /måndag \d+ augusti \d+ tisdag 1 september \d+ onsdag 2 september \d+ torsdag 3 september \d+ fredag 4 september \d+ lördag 5 september \d+ söndag 6 september \d+/:
        - gridcell /måndag \d+ augusti \d+/:
          - button /måndag \d+ augusti \d+/ [disabled]
        - gridcell /tisdag 1 september \d+/:
          - button /tisdag 1 september \d+/
        - gridcell /onsdag 2 september \d+/:
