- link "Hoppa till innehåll":
  - /url: "#astryx-app-shell-main"
- banner:
  - navigation "Tal till text":
    - link "Tal till text – Eneo":
      - /url: /flows
      - img "Eneo"
      - text: Tal till text
    - link "Alla flöden":
      - /url: /flows
    - button "Öppna konto för Erik Lund":
      - img "Erik Lund": EL
      - status
- main:
  - heading "Nämndmöte till rapport" [level=1]
  - paragraph: Transkriberar mötet och skapar en PDF-rapport med beslut och sammanfattning.
  - region "Senaste körningar":
    - heading "Senaste körningar" [level=2]
    - list:
      - listitem:
        - text: /Styrelsemöte Möte 22 sep( \d{4})? · startad i går \d+:\d+ Klar/
        - button /Öppna, Styrelsemöte, möte 22 sep( \d{4})?, startad i går \d+:\d+/:
          - text: ""
          - status
      - listitem:
        - text: /\d+ sep \d+:\d+ Misslyckades/
        - button /Öppna, körningen \d+ sep \d+:\d+/:
          - text: ""
          - status
      - listitem:
        - text: /Avdelningsmöte Möte 19 sep( \d{4})? · startad \d+ sep \d+:\d+ Klar/
        - button /Öppna, Avdelningsmöte, möte 19 sep( \d{4})?, startad \d+ sep \d+:\d+/:
          - text: ""
          - status
    - button "Visa alla körningar":
      - text: ""
      - status
  - region "Så fungerar det":
    - heading "Så fungerar det" [level=2]
    - list:
      - listitem: Du spelar in eller laddar upp ljud.
      - listitem: Ljudet görs om till text.
      - listitem: Du får ett dokument att ladda ner.
  - note: Öppen information Använd bara information som får lämnas ut till vem som helst.
  - region "Ljudet":
    - status
    - status
    - heading "Hur vill du lägga till ljudet?" [level=2]
    - text: Hur vill du lägga till ljudet?
    - radiogroup "Hur vill du lägga till ljudet?":
      - radio "Strömma" [checked]
      - text: Strömma Se texten medan du pratar, också i helskärm för rummet. Ljudet skickas till Eneo direkt.
      - radio "Spela in"
      - text: Spela in Spela in nu och transkribera efteråt. Ljudet stannar på enheten tills du skickar det.
      - radio "Ladda upp"
      - text: Ladda upp Välj en ljudfil från din enhet.
    - text: Mikrofon Testa mikrofonen före mötet. Testet spelas inte in och skickas inte.
    - combobox "Mikrofon": Standard (Fake Default Audio Input)
    - button "Testa mikrofonen":
      - text: ""
      - status
    - status: Testet visar här om mikrofonen hör dig.
    - button "Tips för bra ljud"
    - text: Deltagare Valfritt Skriv ett namn och välj Lägg till. Skilj flera namn med komma.
    - group "Deltagare Valfritt":
      - text: Lägg till namn
      - textbox "Deltagare Valfritt Lägg till namn":
        - /placeholder: Lägg till namn
      - button "Lägg till" [disabled]:
        - text: ""
        - status
    - status
    - text: Märk upp talare Texten visar vem som sa vad. Det tar längre tid efter inspelningen.
    - switch "Märk upp talare"
    - button "Starta strömning":
      - text: ""
      - status
    - status
    - paragraph: Inspelningen sparas på enheten medan du spelar in. Webbläsaren kan ta bort den om du väntar länge efter att du har stoppat.
    - region "Tidigare körningar":
      - heading "Tidigare körningar" [level=2]
      - list:
        - listitem:
          - text: /Styrelsemöte Möte 22 sep( \d{4})? · startad i går \d+:\d+ Klar/
          - button /Öppna, Styrelsemöte, möte 22 sep( \d{4})?, startad i går \d+:\d+/:
            - text: ""
            - status
        - listitem:
          - text: /\d+ sep \d+:\d+ Misslyckades/
          - button /Öppna, körningen \d+ sep \d+:\d+/:
            - text: ""
            - status
        - listitem:
          - text: /Avdelningsmöte Möte 19 sep( \d{4})? · startad \d+ sep \d+:\d+ Klar/
          - button /Öppna, Avdelningsmöte, möte 19 sep( \d{4})?, startad \d+ sep \d+:\d+/:
            - text: ""
            - status
        - listitem:
          - text: /\d+ sep \d+:\d+ Klar/
          - button /Öppna, körningen \d+ sep \d+:\d+/:
            - text: ""
            - status
