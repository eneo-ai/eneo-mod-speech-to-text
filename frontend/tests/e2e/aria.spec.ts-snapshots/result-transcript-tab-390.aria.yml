- main:
  - heading "Dokumentet är klart" [level=1]
  - paragraph: /Skapad i dag \d+:\d+/
  - button "Ny inspelning":
    - text: ""
    - status
  - tablist "Visa":
    - tab "Dokument"
    - tab "Transkribering" [selected]
  - tabpanel "Transkribering":
    - region "Transkribering":
      - heading "Transkribering" [level=2]
      - button "Kopiera transkriberingen":
        - text: ""
        - status
      - button "Ladda ner som text, transkriberingen":
        - text: ""
        - status
      - region "Inspelning och transkribering":
        - group "Visa talare":
          - button "Alla" [pressed]:
            - text: ""
            - status
          - button "Talare 1":
            - text: ""
            - status
          - button "Talare 2":
            - text: ""
            - status
        - text: Sök i transkriberingen
        - textbox "Sök i transkriberingen"
        - status
        - status
        - link "Hoppa förbi transkriberingen":
          - /url: /#.+/
        - heading "Del 1" [level=3]
        - list "Del 1":
          - listitem /Talare 1, 0:\d+ i del 1/:
            - button "Talare 1, ändra talare"
            - button /Spela från 0:\d+ i del 1/
            - text: Välkomna till kommunstyrelsens möte.
            - button /Rätta repliken från 0:\d+ i del 1/
          - listitem /Talare 2, 0:\d+ i del 1/:
            - button "Talare 2, ändra talare"
            - button /Spela från 0:\d+ i del 1/
            - text: Första punkten gäller budgeten för nästa år.
            - button /Rätta repliken från 0:\d+ i del 1/
          - listitem /Talare 1, 0:\d+ i del 1/:
            - button "Talare 1, ändra talare"
            - button /Spela från 0:\d+ i del 1/
            - text: Ramen höjs med två procent och förvaltningen återkommer i oktober.
            - button /Rätta repliken från 0:\d+ i del 1/
        - heading "Del 2" [level=3]
        - list "Del 2":
          - listitem /Talare 2, 0:\d+ i del 2/:
            - button "Talare 2, ändra talare"
            - button /Spela från 0:\d+ i del 2/
            - text: Andra punkten är skolskjutsarna.
            - button /Rätta repliken från 0:\d+ i del 2/
          - listitem /Talare 1, 0:\d+ i del 2/:
            - button "Talare 1, ändra talare"
            - button /Spela från 0:\d+ i del 2/
            - text: Nya turer börjar gälla efter höstlovet.
            - button /Rätta repliken från 0:\d+ i del 2/
        - button "Hastighet 1×":
          - text: ""
          - status
        - 'group "Uppspelning: Inspelningen"':
          - button "Spela upp":
            - status
          - text: Position i inspelningen
          - slider "Position i inspelningen"
          - text: /0:\d+ \/ 0:\d+/