# The image acceptance stack (deploy/acceptance.sh): the image under test, the stub as its Eneo, and a Traefik in front. Everything is
# published on 127.0.0.1 only. The ports and the image come from the environment (acceptance.sh sets them; the defaults are its own).
#
#   browser, checks ----> traefik (ACCEPT_TRAEFIK_PORT) ----> speech-to-text:3001      MODULE_PUBLIC_URL is the Traefik address
#   checks (direct) -----------------------------------------> speech-to-text (ACCEPT_DIRECT_PORT)
#   browser, checks ----> eneo (ACCEPT_ENEO_PORT): the sign-in handshake; the image reaches it as http://eneo:8481
#
# The containers have fixed names, which the checks use for docker top, exec, stop and the memory probe.
name: stt-acceptance

services:
  speech-to-text:
    image: ${ACCEPT_IMAGE:-eneo-mod-speech-to-text:acceptance}
    container_name: stt-acceptance-module
    environment:
      ENEO_BACKEND_URL: http://eneo:8481
      ENEO_PUBLIC_URL: http://127.0.0.1:${ACCEPT_ENEO_PORT:-8481}
      MODULE_PUBLIC_URL: http://127.0.0.1:${ACCEPT_TRAEFIK_PORT:-8480}
      MODULE_KEY: speech-to-text
      ENEO_API_KEY: acceptance-service-key
      SESSION_SECRET: acceptance-session-secret-at-least-32-characters
      COOKIE_SECURE: "false"
      # MAX_UPLOAD_BYTES caps the whole request body, multipart overhead included: a benchmark that must complete sets it above
      # the largest file's encoded body (the default of 1 GiB is below a 1 GiB file's body, so flat memory there would only
      # show an early rejection). checks.py starts the image with a small cap for the rejection.
      MAX_UPLOAD_BYTES: ${ACCEPT_MAX_UPLOAD_BYTES:-3221225472}
    ports:
      - "127.0.0.1:${ACCEPT_DIRECT_PORT:-8482}:3001"
    depends_on:
      - eneo

  eneo:
    image: python:3.12-slim
    container_name: stt-acceptance-eneo
    # A plain python as PID 1 ignores SIGTERM; an init stops it at once.
    init: true
    working_dir: /repo/frontend/tests/e2e
    volumes:
      # The stub reads its fixtures (ids.json) and the backend's accent code from the repository, as it does outside Docker.
      - ../../frontend/tests:/repo/frontend/tests:ro
      - ../../backend:/repo/backend:ro
    environment:
      STUB_HOST: 0.0.0.0
      MODULE_KEY: speech-to-text
      ENEO_API_KEY: acceptance-service-key
    command: ["python", "stub-server.py", "8481"]
    ports:
      - "127.0.0.1:${ACCEPT_ENEO_PORT:-8481}:8481"

  traefik:
    # Exact v3.7 patch release, the line the module's WebSocket check was verified on (docs/eneo-integration.md); checks.py prints the digest.
    image: traefik:v3.7.13
    container_name: stt-acceptance-traefik
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./routes.yml:/etc/traefik/routes.yml:ro
    ports:
      - "127.0.0.1:${ACCEPT_TRAEFIK_PORT:-8480}:80"
    depends_on:
      - speech-to-text
