[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:backend]
; Backend startas av startprogrammet, som ensam sätter en arbetsprocess, ingen accessloggen
; (callback-queryn bär en login-ticket) och live-reläets WebSocket-gränser (backend/app/limits.py:
; högst 128 KiB per meddelande, 16 i kö). Inga uvicorn-flaggor här.
command=/opt/venv/bin/python -m app.serve --api-only --host 127.0.0.1 --port 8000
directory=/app/backend
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:frontend]
command=/usr/local/bin/node /app/frontend/server.js
directory=/app/frontend
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
