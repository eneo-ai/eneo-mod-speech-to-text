[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:backend]
; Live-reläets browser-WebSocket: högst 128 KiB per meddelande (Eneos
; PCM-ramar är högst 64 KiB) och 16 i kö, alltså högst 2 MiB per anslutning.
command=/opt/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log --ws-max-size 131072 --ws-max-queue 16
directory=/app/backend
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:frontend]
command=/usr/local/bin/node /app/frontend/server.js
directory=/app/frontend
autostart=true
autorestart=unexpected
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
