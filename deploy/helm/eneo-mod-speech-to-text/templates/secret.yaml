{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  ENEO_API_KEY: {{ required "set secret.ENEO_API_KEY, or existingSecret" .Values.secret.ENEO_API_KEY | quote }}
  SESSION_SECRET: {{ required "set secret.SESSION_SECRET, or existingSecret" .Values.secret.SESSION_SECRET | quote }}
{{- end }}
