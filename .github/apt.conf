// apt in CI (put in /etc/apt/apt.conf.d/ by apt-retry.sh, which every apt use goes through): a download that receives
// nothing for 20 seconds is given up and tried again, up to five times. A mirror that trickles is apt-retry.sh's to cut.
Acquire::http::Timeout "20";
Acquire::https::Timeout "20";
Acquire::Retries "5";
