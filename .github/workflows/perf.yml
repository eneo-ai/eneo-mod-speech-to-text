name: Performance

# `npm run perf` on the built UI (frontend/scripts/perf.mjs). A pull request measures its base and its head in this one job, on this one
# runner, one after the other with the same script and the same budget, and compares them: timings differ between runners, so only the
# difference between the two sides is trusted. A nightly run and a manual run measure the checked-out ref alone, for the trend.
# Informational: this job is not a required check. Every action is pinned to the commit of a release, the release in the comment.

on:
  pull_request:
    paths: ["frontend/**", "backend/**", ".github/workflows/perf.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC, on the default branch

permissions:
  contents: read

# A newer push to a pull request replaces the older run; a nightly or a manual run is never cancelled.
concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # In a pull request the two sides are labelled; otherwise the label is the short commit, which is what the trend wants.
      LABEL_ARGS: ${{ github.event_name == 'pull_request' && '--label head' || '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      # A pull request is checked out as GitHub's merge commit of its head into the base. With two commits of history, the first
      # parent is the base as it is now, so the comparison is exactly what the pull request adds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The backend of both sides runs on this one set of packages.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        run: python -m pip install --require-hashes --no-deps -r ${{ github.workspace }}/backend/requirements.lock
      - name: Install frontend dependencies
        run: npm ci
      # apt-get update and install as `sudo timeout`, three tries, the runner's mirror and then two others (.github/apt-retry.sh):
      # a mirror that stalls or trickles is cut off and another tried.
      - name: Install the browser's system libraries
        timeout-minutes: 18
        run: ${{ github.workspace }}/.github/apt-retry.sh --playwright chromium
      # Five minutes a try, three tries: a download that hangs is cut off and made again.
      - name: Install the browser
        timeout-minutes: 16
        run: for try in 1 2 3; do timeout 300 npx playwright install chromium && exit 0; echo "::warning::browser download, try $try failed"; done; exit 1
      - name: Build frontend
        run: npm run build

      # The base is a second working tree of the same repository. It is measured with the head's perf.mjs and budget, so that both sides
      # have the same ruler (and a base from before the script existed can still be measured); its app, backend and fixtures are its own.
      - name: Check out the base
        if: github.event_name == 'pull_request'
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          mkdir -p "$RUNNER_TEMP/base/frontend/scripts" "$RUNNER_TEMP/base/frontend/tests/perf"
          cp scripts/perf.mjs "$RUNNER_TEMP/base/frontend/scripts/perf.mjs"
          cp tests/perf/budget.json "$RUNNER_TEMP/base/frontend/tests/perf/budget.json"
      # The base's backend runs on the base's own locked packages, in a virtual environment of its own: a pull request that
      # changes a dependency is then measured against the packages it replaces.
      - name: Install and build the base
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}/base/frontend
        run: |
          python -m venv "$RUNNER_TEMP/base-venv"
          "$RUNNER_TEMP/base-venv/bin/python" -m pip install --require-hashes --no-deps -r ../backend/requirements.lock
          npm ci
          npx playwright install chromium
          npm run build

      # The base first, then the head, with nothing else running. A base that cannot be measured (the pull request adds what the
      # measurement needs) does not fail the job.
      - name: Measure the base
        if: github.event_name == 'pull_request'
        working-directory: ${{ runner.temp }}/base/frontend
        # The script itself, not an npm entry the base may not have.
        run: |
          BACKEND_PYTHON="$RUNNER_TEMP/base-venv/bin/python" node scripts/perf.mjs --label base --runs 3 2>&1 || true
          mkdir -p "$GITHUB_WORKSPACE/frontend/test-results/perf"
          if [ -f test-results/perf/base.json ]; then
            cp test-results/perf/base.json "$GITHUB_WORKSPACE/frontend/test-results/perf/base.json"
          else
            echo "::warning title=The base was not measured::The head's numbers are reported, not compared."
          fi
      # Exit 1 when the measurement broke. The budget is set on a developer's machine, which this runner is several times slower
      # than: over it (exit 2) is a warning here, and only the comparison with the base below fails the job on a number.
      - name: Measure the head
        run: |
          status=0
          npm run --silent perf -- $LABEL_ARGS --runs 3 > "$RUNNER_TEMP/head.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/head.txt"
          { echo "### Head against the budget"; echo '```'; cat "$RUNNER_TEMP/head.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" = 2 ]; then
            echo "::warning title=Over the budget on this runner::$(tail -n 1 "$RUNNER_TEMP/head.txt")"
            status=0
          fi
          exit $status
      # Exit 1 when a CLS or an INP of the head is clearly worse than the base's (perf.mjs: over 30 % and over 40 ms; CLS over 0.02).
      - name: Compare the head with the base
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('frontend/test-results/perf/base.json') != '' && hashFiles('frontend/test-results/perf/head.json') != '' }}
        run: |
          status=0
          npm run --silent perf -- --compare base head --fail-on-regression > "$RUNNER_TEMP/compare.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/compare.txt"
          { echo "### Head against base, on the same runner"; echo '```'; cat "$RUNNER_TEMP/compare.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Say that the base was not measured
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('frontend/test-results/perf/base.json') == '' }}
        run: echo "The base could not be measured, so nothing was compared." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: perf-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref_name, github.run_number) }}
          path: frontend/test-results/perf/*.json
          if-no-files-found: ignore
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
