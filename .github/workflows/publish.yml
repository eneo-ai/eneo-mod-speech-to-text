name: Publish module image

# Called by ci.yml, after every job of that run passed: this workflow has no trigger of its own. It pushes the image the acceptance
# tested, the archive the `image` job kept, with its SBOM and provenance and under the digest the acceptance saw. It never builds.
# The tag is the commit (sha-<40 hex>); a version and `latest` are given later, by release.yml, to the image of the tagged commit.

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  # Same retained Skopeo release and digest as ci.yml.
  SKOPEO: quay.io/containers/skopeo:v1.22.3-immutable@sha256:f45eb1e14223a5ba0da4246274679a083653dab1402acc1fcb70a6339b50cf00

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: module-image
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/eneo-ai/eneo-mod-speech-to-text
          tags: |
            type=sha,format=long
      - name: Push the tested image under each tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          CREDENTIALS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          digest="$(cat digest.txt)"
          for tag in $TAGS; do
            docker run --rm -v "$PWD:/in:ro" "$SKOPEO" copy --all --preserve-digests \
              --dest-creds "$CREDENTIALS" oci-archive:/in/image.tar "docker://$tag"
            # What the registry holds under the tag is the tested digest.
            pushed="$(docker run --rm "$SKOPEO" inspect --raw --creds "$CREDENTIALS" "docker://$tag" | sha256sum | cut -d' ' -f1)"
            test "sha256:$pushed" = "$digest"
            echo "$tag $digest"
          done
