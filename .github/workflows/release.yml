name: Release

# A tag vX.Y.Z on a commit of main. It gives that commit's tested image its version and `latest`, and creates the GitHub Release with the
# compose file, the example settings set to this version and the Helm chart packaged as this version attached; nothing is committed
# back. It builds nothing: the image is the one ci.yml tested and publish.yml pushed as sha-<commit>, copied registry to registry
# under the new tags with its digest kept, and the digest is checked after each copy.
# The release checks itself first: the tested image has to say, in its revision label, the commit the tag is on.
# A commit CI has not passed on main has no such image, and its tag fails here: run the job again once CI has passed.
# Every action is pinned to the commit of a release, and the image skopeo runs in to a digest (docs/operations.md has the routine).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# Two tags pushed together are released one after the other.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/eneo-ai/eneo-mod-speech-to-text
  # Same retained Skopeo release and digest as ci.yml and publish.yml.
  SKOPEO: quay.io/containers/skopeo:v1.22.3-immutable@sha256:f45eb1e14223a5ba0da4246274679a083653dab1402acc1fcb70a6339b50cf00

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub Release
      packages: write # the version tags in the registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - id: promote
        name: Give the tested image of this commit its version and latest
        env:
          CREDENTIALS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The commit the tag points to, whether the tag is lightweight or annotated.
          commit="$(git rev-parse HEAD)"
          source="$IMAGE:sha-$commit"
          if ! docker run --rm "$SKOPEO" inspect --raw --creds "$CREDENTIALS" "docker://$source" > /dev/null; then
            echo "::error::cannot read $source. A commit CI has not passed on main (yet) has no tested image: tag one it has passed, or run this job again when it has. Any other cause is in the output above."
            exit 1
          fi
          # Before any tag moves: the tested image says it was made from the tagged commit. Its revision label is written by
          # ci.yml from what its /health answer is written from, so a deployment of this version answers this commit.
          revision="$(docker run --rm "$SKOPEO" inspect --creds "$CREDENTIALS" \
            --format '{{index .Labels "org.opencontainers.image.revision"}}' "docker://$source")"
          if [ "$revision" != "$commit" ]; then
            echo "::error::$source says it was made from '$revision', and the tag is on $commit. No tag is moved and no release is created."
            exit 1
          fi
          echo "$source revision $revision"
          digest="sha256:$(docker run --rm "$SKOPEO" inspect --raw --creds "$CREDENTIALS" "docker://$source" | sha256sum | cut -d' ' -f1)"
          for tag in "$GITHUB_REF_NAME" latest; do
            docker run --rm "$SKOPEO" copy --all --preserve-digests --src-creds "$CREDENTIALS" --dest-creds "$CREDENTIALS" \
              "docker://$source" "docker://$IMAGE:$tag"
            # What the registry holds under the tag is the digest CI tested.
            pushed="$(docker run --rm "$SKOPEO" inspect --raw --creds "$CREDENTIALS" "docker://$IMAGE:$tag" | sha256sum | cut -d' ' -f1)"
            test "sha256:$pushed" = "$digest"
            echo "$IMAGE:$tag $digest"
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.promote.outputs.digest }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          mkdir "$assets"
          cp docker-compose.yml "$assets/docker-compose.yml"
          # GitHub renames an asset whose name starts with a dot (".env.example" would be "default.env.example"). The copy runs
          # this release: an operator fills in the rest.
          sed "s/^MODULE_VERSION=.*/MODULE_VERSION=$GITHUB_REF_NAME/" .env.example > "$assets/env.example"
          grep -qx "MODULE_VERSION=$GITHUB_REF_NAME" "$assets/env.example"
          # The chart's image tag is its appVersion: this release.
          helm package deploy/helm/eneo-mod-speech-to-text --version "${GITHUB_REF_NAME#v}" --app-version "$GITHUB_REF_NAME" --destination "$assets"
          chart="$assets/eneo-mod-speech-to-text-${GITHUB_REF_NAME#v}.tgz"
          {
            echo "Image: \`$IMAGE:$GITHUB_REF_NAME\` (\`$DIGEST\`). Samma image som CI testade för commit $(git rev-parse --short=7 HEAD); den är inte ombyggd."
            echo
            echo "Docker Compose, Dokploy, Portainer och Podman: ladda ner \`docker-compose.yml\` och \`env.example\` nedan, spara den andra som \`.env\` och fyll i den; \`MODULE_VERSION=$GITHUB_REF_NAME\` står redan där. Kubernetes: Helm-charten \`$(basename "$chart")\`. Se [Driftsätt](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/operations.md#driftsätt)."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$assets/docker-compose.yml" "$assets/env.example" "$chart" \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --verify-tag
