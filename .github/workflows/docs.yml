name: Docs

# The documentation site (docs-site/, built from docs/). A pull request builds and checks it with read-only access; only a push to
# main or a manual run on main deploys it, from its own job, which is the only one that holds the Pages permissions. Every action is pinned to the commit of a
# release, the release in the comment (the routine is in docs/operations.md).

on:
  workflow_dispatch:
  pull_request:
    paths: ["docs/**", "docs-site/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "docs-site/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check content generation and API labels
        run: npm test
      # Fails on a link that leads nowhere.
      - name: Build the site
        run: npm run build
      # Astro generates content types during the build, including OpenAPI pages.
      - name: Check strict TypeScript
        run: npm run typecheck
      # apt-get update and install as `sudo timeout`, three tries, the runner's mirror and then two others (.github/apt-retry.sh):
      # a mirror that stalls or trickles is cut off and another tried.
      - name: Install the browser's system libraries
        timeout-minutes: 18
        run: ${{ github.workspace }}/.github/apt-retry.sh --playwright chromium
      # Five minutes a try, three tries: a download that hangs is cut off and made again.
      - name: Install the browser
        timeout-minutes: 16
        run: for try in 1 2 3; do timeout 300 npx playwright install chromium && exit 0; echo "::warning::browser download, try $try failed"; done; exit 1
      # Every documentation and API page in both themes, plus search, keyboard, narrow menus and diagrams.
      - name: Check the built site in a browser
        run: npm run check
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
