name: Full gate

# The accessibility gate in the projects of frontend/playwright.config.ts that a pull request's CI does not run in full. ci.yml runs
# phone-390-light and laptop-1440-light entirely, and parts of the tablets, the phone on its side, WebKit and Firefox; this runs the rest:
# 320 px, dark, 200 % zoom, forced colours, reduced motion, the other laptop and wide widths, and the press on every control on the
# tablets and in Firefox. WebKit's press runs on a Mac (npm run verify:candidate): Playwright's WebKit for Linux fails it broadly.
# On a Mac it also scans the three WebKit projects with the states that record, which Playwright's WebKit for Linux cannot,
# and two jobs scan the module in accents at the edge of what the backend accepts.
# Every night on main, by hand, and on a pull request that changes the projects or this file, or that carries the label
# full-gate (a change to how the pages look: this half has found faults that a pull request's CI cannot).
# A red nightly opens an issue, "Nightly gate red", or adds the run to the one that is open.
# Every action is pinned to the commit of a release, the release in the comment (docs/operations.md has the routine).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
  schedule:
    - cron: "43 1 * * *" # 01:43 UTC, on the default branch

permissions:
  contents: read

env:
  # Every project but ci.yml's two (Playwright refuses a project with no test of the spec, so the press names only its own).
  SCAN_PROJECTS: >-
    --project=phone-320-light --project=phone-390-dark --project=tablet-portrait --project=tablet-landscape --project=landscape-844
    --project=laptop-1000-light --project=laptop-1280-light --project=laptop-1440-dark --project=zoom-200 --project=forced-colors
    --project=ultrawide-1920-light --project=ultrawide-2560-light --project=reduced-motion
    --project=phone-390-webkit --project=tablet-landscape-webkit --project=laptop-1440-webkit --project=laptop-1440-firefox
  CONTROLS_PROJECTS: >-
    --project=tablet-portrait --project=tablet-landscape --project=laptop-1440-firefox
  PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
  # A test that passes only on its retry fails the nightly: a race is fixed in the morning, not retried for ever.
  GATE_FAIL_ON_FLAKY: ${{ github.event_name == 'schedule' && '1' || '' }}
  # Before the job's own limit, so a run that hangs ends with its report.
  GLOBAL_TIMEOUT: "--global-timeout=2700000"

jobs:
  # Whether a pull request runs the gate: it changes the projects, the sharding or this file, or it carries full-gate.
  decide:
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-gate')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'full-gate') }}
        run: |
          if [ "$LABELLED" = true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename' > changed.txt
          if grep -qxE 'frontend/playwright\.config\.ts|\.github/workflows/gate\.yml|frontend/scripts/controls-shard\.mjs|frontend/tests/e2e/controls-weights\.json' changed.txt
          then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  gate:
    name: gate (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.total }})
    needs: decide
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.decide.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A newer push to a pull request replaces the older run; a nightly or a manual run is never cancelled.
    concurrency:
      group: gate-${{ github.ref }}-${{ matrix.suite }}-${{ matrix.shard }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      # The press on every control takes about 40 s a test and the rest about 5 s: each has shards of its own, as in ci.yml.
      matrix:
        include:
          - { suite: controls, shard: 1, total: 6 }
          - { suite: controls, shard: 2, total: 6 }
          - { suite: controls, shard: 3, total: 6 }
          - { suite: controls, shard: 4, total: 6 }
          - { suite: controls, shard: 5, total: 6 }
          - { suite: controls, shard: 6, total: 6 }
          - { suite: scan, shard: 1, total: 8 }
          - { suite: scan, shard: 2, total: 8 }
          - { suite: scan, shard: 3, total: 8 }
          - { suite: scan, shard: 4, total: 8 }
          - { suite: scan, shard: 5, total: 8 }
          - { suite: scan, shard: 6, total: 8 }
          - { suite: scan, shard: 7, total: 8 }
          - { suite: scan, shard: 8, total: 8 }
          # The module in accents at the edge of what backend/app/accent.py accepts: an orange as light as light mode allows
          # with the darkest dark mode allows, and a red near the error colour (accepted, with a warning).
          - { suite: accent, shard: 1, total: 2, accent: "#AE5C09", accent_dark: "#D06E0B" }
          - { suite: accent, shard: 2, total: 2, accent: "#B4232A", accent_dark: "" }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The browsers of the locked Playwright, kept between runs (as in ci.yml).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-chromium webkit firefox
      - run: npm ci
      # A shard can hold any engine's projects.
      - name: Install the browsers' system libraries
        timeout-minutes: 10
        run: npx playwright install-deps chromium webkit firefox
      # Five minutes a try, three tries: a download that hangs is cut off and made again.
      - name: Install browsers
        timeout-minutes: 16
        run: for try in 1 2 3; do timeout 300 npx playwright install chromium webkit firefox && exit 0; echo "::warning::browser download, try $try failed"; done; exit 1
      # Firefox runs Web Audio only with a sound server (as in ci.yml).
      - name: A sound server for Firefox
        run: sudo apt-get install -y --no-install-recommends pulseaudio && pulseaudio --start --exit-idle-time=-1
      # Sharded by each test's measured time, as in ci.yml (scripts/controls-shard.mjs).
      - name: The press on every control, on the tablets and in Firefox
        if: matrix.suite == 'controls'
        run: npx playwright test controls.spec.ts $CONTROLS_PROJECTS --workers=2 $GLOBAL_TIMEOUT --grep="$(node scripts/controls-shard.mjs ${{ matrix.shard }}/${{ matrix.total }} $CONTROLS_PROJECTS)" --add-reporter=json
      - name: Everything else in the other projects
        if: matrix.suite == 'scan'
        run: npx playwright test $SCAN_PROJECTS --grep-invert='controls\.spec\.ts' --workers=2 $GLOBAL_TIMEOUT --shard=${{ matrix.shard }}/${{ matrix.total }} --add-reporter=json
      # Every state's scan on a phone in light mode and a laptop in dark mode, the accent the stub serves (STUB_ACCENT).
      - name: The scan in an edge accent
        if: matrix.suite == 'accent'
        env:
          STUB_ACCENT: ${{ matrix.accent }}
          STUB_ACCENT_DARK: ${{ matrix.accent_dark }}
        run: npx playwright test a11y.spec.ts --project=phone-390-light --project=laptop-1440-dark --workers=2 $GLOBAL_TIMEOUT --add-reporter=json
      - name: Summary
        if: ${{ !cancelled() }}
        run: node scripts/ci-summary.mjs test-results/results.json gate-results-${{ matrix.suite }}-${{ matrix.shard }} >> "$GITHUB_STEP_SUMMARY"
      - name: Keep test results and timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: gate-timings-${{ matrix.suite }}-${{ matrix.shard }}
          path: frontend/test-results/results.json
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: gate-results-${{ matrix.suite }}-${{ matrix.shard }}
          path: frontend/test-results

  # Safari's engine as it runs on a Mac, where it records: the three WebKit projects' scans, keyboard walks and screen-reader
  # snapshots with the states that record, which the Linux runs above skip (`records` in tests/e2e/screens.ts). The press
  # on every control stays npm run verify:candidate's.
  webkit-mac:
    name: gate (WebKit on a Mac, ${{ matrix.project }})
    needs: decide
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.decide.outputs.run == 'true') }}
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: gate-${{ github.ref }}-mac-${{ matrix.project }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        project: [phone-390-webkit, tablet-landscape-webkit, laptop-1440-webkit]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-webkit
      - run: npm ci
      - name: Install WebKit
        timeout-minutes: 16
        run: for try in 1 2 3; do npx playwright install webkit && exit 0; echo "::warning::browser download, try $try failed"; done; exit 1
      - name: The WebKit project, with the states that record
        run: npx playwright test --project=${{ matrix.project }} --grep-invert='controls\.spec\.ts' --workers=2 $GLOBAL_TIMEOUT --add-reporter=json
      - name: Summary
        if: ${{ !cancelled() }}
        run: node scripts/ci-summary.mjs test-results/results.json gate-results-mac-${{ matrix.project }} >> "$GITHUB_STEP_SUMMARY"
      - name: Keep test results and timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: gate-timings-mac-${{ matrix.project }}
          path: frontend/test-results/results.json
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: gate-results-mac-${{ matrix.project }}
          path: frontend/test-results

  # A red nightly is said where the team looks: one open issue, with a comment per red night.
  report:
    needs: [gate, webkit-mac]
    if: ${{ always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly gate red"
          body="$(date -u +%F): $RUN (each red job's summary lists the tests that failed)"
          number=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then gh issue comment "$number" -R "$REPO" --body "$body"; else gh issue create -R "$REPO" --title "$title" --body "$body"; fi
