name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests
      # Freeze before pip-audit is installed: the audit covers what the image
      # ships, not pip-audit's own dependencies or the runner's pip.
      - name: Audit production dependencies
        run: |
          python -m pip freeze > "$RUNNER_TEMP/backend-installed.txt"
          python -m pip install pip-audit
          pip-audit --requirement "$RUNNER_TEMP/backend-installed.txt" --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Check frontend types
        run: npm run lint
      - name: Check the design system setup
        run: npm run astryx -- doctor
      - name: Check the built theme is current
        run: npm run theme:build && git diff --exit-code -- kit/theme/built
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        run: npm run build

  frontend-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: Production build in three engines
        run: npm run test:prod
      - name: Accessibility gate, one phone and one laptop
        run: npx playwright test --project=phone-390-light --project=laptop-1440-light --workers=2
      - name: Branding gate, a deployment with its own organisation and accent
        run: STUB_BRANDING=custom npx playwright test --config playwright.branding.config.ts --project=laptop-1440-light --project=phone-390-dark
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-results
          path: frontend/test-results

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production module image
        run: docker build --tag eneo-mod-speech-to-text:test .
