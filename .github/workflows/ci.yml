name: CI

# Every action is pinned to the commit of a release, the release in the comment; every image a job runs is pinned to a digest.
# The update routine is in docs/operations.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces the older run; a run on main is never cancelled, so a publish that has begun ends. A tag runs
# no CI: release.yml gives the image that passed here, for the tagged commit, its version.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # The lock the image installs, with its hashes: what is tested and audited here is what ships.
      - name: Install backend dependencies
        run: python -m pip install --require-hashes --no-deps -r backend/requirements.lock
      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests
      - name: Run the fake Eneo's own tests
        run: python -m unittest frontend/tests/e2e/test_stub_eneo.py
      - name: Run the acceptance scripts' own tests
        run: python -m unittest deploy/acceptance/test_live_load.py deploy/acceptance/test_checks.py
      - name: Audit production dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --requirement backend/requirements.lock --require-hashes --disable-pip

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Check frontend types
        run: npm run lint
      - name: Check the design system setup
        run: npm run astryx -- doctor
      - name: Check the built theme is current
        run: npm run theme:build && git diff --exit-code -- kit/theme/built
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        run: npm run build

  frontend-browser:
    name: frontend-browser (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suite: controls, shard: 1, total: 5 }
          - { suite: controls, shard: 2, total: 5 }
          - { suite: controls, shard: 3, total: 5 }
          - { suite: controls, shard: 4, total: 5 }
          - { suite: controls, shard: 5, total: 5 }
          - { suite: accessibility, shard: 1, total: 4 }
          - { suite: accessibility, shard: 2, total: 4 }
          - { suite: accessibility, shard: 3, total: 4 }
          - { suite: accessibility, shard: 4, total: 4 }
          - { suite: devices, shard: 1, total: 1 }
          - { suite: webkit, shard: 1, total: 1 }
          - { suite: firefox, shard: 1, total: 1 }
          - { suite: production, shard: 1, total: 1 }
          - { suite: real-backend, shard: 1, total: 1 }
          - { suite: branding, shard: 1, total: 1 }
    env:
      PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Each runner has its own app and stub. Only built-app suites need the backend's dependencies.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        if: matrix.suite == 'production' || matrix.suite == 'real-backend'
        run: python -m pip install --require-hashes --no-deps -r ${{ github.workspace }}/backend/requirements.lock
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.suite == 'production' && 'chromium webkit firefox' || matrix.suite == 'webkit' && 'webkit' || matrix.suite == 'firefox' && 'firefox' || 'chromium' }}
      # Firefox runs Web Audio (the level meter, the silence it hears, the live text's capture) only with a sound server,
      # which a runner has none of: one that plays into a sink of nothing stands in for a computer's.
      - name: A sound server for Firefox
        if: matrix.suite == 'firefox'
        run: sudo apt-get install -y --no-install-recommends pulseaudio && pulseaudio --start --exit-idle-time=-1
      - name: Production build in three engines
        if: matrix.suite == 'production'
        run: npm run test:prod -- --workers=2 --add-reporter=json
      # Controls account for most browser time. Shard them separately so a shard of short scans does not wait for them.
      - name: Every control, one phone and one laptop
        if: matrix.suite == 'controls'
        run: npx playwright test controls.spec.ts --project=phone-390-light --project=laptop-1440-light --workers=2 --shard=${{ matrix.shard }}/${{ matrix.total }} --add-reporter=json
      - name: Accessibility gate, one phone and one laptop
        if: matrix.suite == 'accessibility'
        run: npx playwright test --grep-invert='controls\.spec\.ts' --project=phone-390-light --project=laptop-1440-light --workers=2 --shard=${{ matrix.shard }}/${{ matrix.total }} --add-reporter=json
      # The projects are named here, so what a pull request runs is what this file says. Playwright matches --grep against
      # "project file title", which lets one command give each project its own specs.
      # A phone on its side is scanned in every state; a finger's tablet, upright and on its side, is walked with the keyboard.
      - name: A phone on its side, and the keyboard on both tablets
        if: matrix.suite == 'devices'
        run: npx playwright test --project=landscape-844 --project=tablet-portrait --project=tablet-landscape --grep='landscape-844 .*a11y\.spec\.ts|keyboard\.spec\.ts' --workers=2 --add-reporter=json
      # The other engines run what an engine can change: the scan, the keyboard walks and the screen-reader snapshots, and the
      # checks' own tests, which are each engine's laptop project's. Their press on every control is not a pull request's: it
      # is the gate's longest part, and Chromium's runs above. Playwright's WebKit for Linux cannot record, so the states
      # that record are left out there and the upload-only setup is required instead (`records` in tests/e2e/screens.ts).
      - name: WebKit, the portable checks on a phone and the checks' own tests
        if: matrix.suite == 'webkit'
        run: npx playwright test --project=phone-390-webkit --project=laptop-1440-webkit --grep='phone-390-webkit|harness\.spec\.ts' --grep-invert='controls\.spec\.ts' --workers=2 --add-reporter=json
      - name: Firefox, the portable checks and the checks' own tests on a laptop
        if: matrix.suite == 'firefox'
        run: npx playwright test --project=laptop-1440-firefox --grep-invert='controls\.spec\.ts' --workers=2 --add-reporter=json
      - name: Accessibility gate through the real backend under the strict policy, one phone and one laptop
        if: matrix.suite == 'real-backend'
        run: npm run build:check && GATE_TARGET=real npx playwright test --project=phone-390-light --project=laptop-1440-dark --workers=2 --add-reporter=json
      - name: Branding gate, a deployment with its own organisation and accent
        if: matrix.suite == 'branding'
        run: STUB_BRANDING=custom npx playwright test --config playwright.branding.config.ts --project=laptop-1440-light --project=phone-390-dark --workers=2 --add-reporter=json
      - name: Keep test results and timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: frontend-browser-timings-${{ matrix.suite }}-${{ matrix.shard }}
          path: frontend/test-results/results.json
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: frontend-browser-results-${{ matrix.suite }}-${{ matrix.shard }}
          path: frontend/test-results

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The file an operator pastes into Dokploy or Portainer, alone; and merged with the developer's override, as `docker compose up` runs it.
      - name: Validate Compose configuration
        run: |
          docker compose -f docker-compose.yml --env-file .env.example config -q
          docker compose --env-file .env.example config -q

  # The image is built once. The acceptance runs on that build, by its digest, and those same bytes are what publish pushes:
  # nothing is rebuilt after the acceptance, and nothing reaches a registry before it. The candidate lives in this job's own registry.
  image:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
    env:
      CANDIDATE: localhost:5000/eneo-mod-speech-to-text
      # Use the retained immutable release: daily stable rebuilds can lose their old digests.
      SKOPEO: quay.io/containers/skopeo:v1.22.3-immutable@sha256:f45eb1e14223a5ba0da4246274679a083653dab1402acc1fcb70a6339b50cf00
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the image-copy tool before building
        run: docker run --rm "$SKOPEO" --version
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: network=host
      # What the image says it was built from, in its labels and on /health (Dockerfile): the commit that is checked out, and
      # the clock read once, so every place that says the build date says the same.
      - name: Read the commit and the time of the build
        id: source
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build the image, with its SBOM and provenance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ env.CANDIDATE }}:ci
          sbom: true
          provenance: mode=max
          build-args: |
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
            BUILD_DATE=${{ steps.source.outputs.built }}
      # Check 12 of the acceptance looks for the speaker review's text in a build with it on, and check 17 holds it to saying
      # no commit: it is built without the two arguments above. This image is not published.
      - name: Build the speaker-review image
        run: docker build --build-arg SPEAKER_REVIEW_ENABLED=true -t eneo-mod-speech-to-text:acceptance-review .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The production tests start the real backend (python -m app.serve) in front of the fake Eneo: it needs its packages.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install backend dependencies
        run: python -m pip install --require-hashes --no-deps -r ${{ github.workspace }}/backend/requirements.lock
      - name: Install what the acceptance's browser checks need
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Accept the image
        env:
          ACCEPT_IMAGE: ${{ env.CANDIDATE }}@${{ steps.build.outputs.digest }}
          ACCEPT_SKIP_BUILD: "1"
          # The commit the image has to say it was built from (check 17).
          ACCEPT_REVISION: ${{ steps.source.outputs.revision }}
        run: deploy/acceptance.sh
      - name: Keep the tested image, exactly
        run: |
          docker run --rm --network host -v "$PWD:/out" "$SKOPEO" copy --all --preserve-digests --src-tls-verify=false \
            "docker://$CANDIDATE@${{ steps.build.outputs.digest }}" oci-archive:/out/image.tar
          echo "${{ steps.build.outputs.digest }}" > digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: module-image
          path: |
            image.tar
            digest.txt
          retention-days: 7
          compression-level: 0

  # Only after every job above passed on this commit, and only for main.
  publish:
    needs: [backend, frontend, frontend-browser, compose, image]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
